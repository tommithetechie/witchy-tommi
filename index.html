<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy night</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070b18;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';

    const DEBUG = new URLSearchParams(location.search).has('debug');

    const SKIN = 0xffd9bf;
    const HOODIE = 0x1a1a1f;
    const JEAN = 0x2b4a94;
    const JEAN_CUFF = 0x3c63b8;
    const HAIR = 0x1f5fe8;
    const LIME = 0xb6f23a;
    const EYE = 0x1f4fc4;
    const EYE_LIGHT = 0x5b9bff;
    const PUPIL = 0x0d1030;
    const LASH = 0x1a1420;
    const BLUSH = 0xff9a9a;
    const OUTLINE = 0x15121f;

    const toonGradient = (() => {
      const tex = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      return tex;
    })();

    const skinGradient = (() => {
      const tex = new THREE.DataTexture(new Uint8Array([185, 235, 255]), 3, 1, THREE.RedFormat);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      return tex;
    })();

    const hairGradient = (() => {
      const tex = new THREE.DataTexture(new Uint8Array([150, 215, 255]), 3, 1, THREE.RedFormat);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      return tex;
    })();

    // Inverted-hull outline: extrude along view-space normals for even line weight.
    const outlineMat = new THREE.ShaderMaterial({
      uniforms: {
        thickness: { value: 0.008 },
        color: { value: new THREE.Color(OUTLINE) },
      },
      vertexShader: `
        uniform float thickness;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vec3 n = normalize(normalMatrix * normal);
          mv.xyz += n * thickness;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 color;
        void main() { gl_FragColor = vec4(color, 1.0); }`,
      side: THREE.BackSide,
    });

    // Skull ellipsoid (head-local) used to seat face decals on the surface.
    const SKULL_C = new THREE.Vector3(0, 0.36, 0);
    const SKULL_R = new THREE.Vector3(0.408, 0.416, 0.384);
    const HAIR_CENTER = new THREE.Vector3(0, 0.38, -0.02);

    const scene = new THREE.Scene();
    scene.background = makeSky();

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 1.25, 4.2);
    camera.lookAt(0, 0.95, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute('aria-label', 'Cozy night stage');
    document.body.appendChild(renderer.domElement);

    const stars = makeStars();
    scene.add(stars);

    const ground = makeGround();
    scene.add(ground);

    const { ambient, moon, fill } = makeLights();
    scene.add(ambient, moon, fill);

    const parts = makeCharacter();
    scene.add(parts.character);

    let controls = null;
    if (DEBUG) {
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.95, 0);
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    window.addEventListener('resize', resize);
    resize();

    function frame() {
      requestAnimationFrame(frame);
      if (controls) controls.update();
      renderer.render(scene, camera);
    }
    frame();

    function makeSky() {
      const canvas = document.createElement('canvas');
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#070b18');
      gradient.addColorStop(0.72, '#1a1440');
      gradient.addColorStop(1, '#3a2468');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeStarTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.12, 'rgba(232,238,255,0.95)');
      gradient.addColorStop(0.4, 'rgba(190,205,255,0.28)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeStars() {
      const group = new THREE.Group();
      group.name = 'stars';
      const texture = makeStarTexture();
      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
      });
      const placements = [
        [-1.45, 2.26, -4.73, 0.14, 0.95],
        [-1.21, 3.03, -6.81, 0.1, 0.7],
        [-1.5, 2.15, -3.65, 0.12, 0.85],
        [-0.64, 2.56, -5.76, 0.09, 0.55],
        [1.5, 2.54, -5.26, 0.16, 1],
        [1.17, 2.19, -7.73, 0.1, 0.75],
        [1.41, 2.15, -3.14, 0.13, 0.9],
        [-1.17, 2.05, -4.12, 0.08, 0.6],
        [0.3, 3.49, -8.85, 0.11, 0.8],
        [-0.29, 2.82, -6.28, 0.08, 0.5],
        [1.32, 3.26, -7.33, 0.12, 0.88],
        [1.22, 2.2, -2.81, 0.1, 0.65],
        [-2.72, 2.43, -8.76, 0.08, 0.45],
        [0.46, 2.55, -4.93, 0.13, 0.92],
        [-1.15, 2.35, -9.72, 0.09, 0.72],
        [1.24, 2.4, -10.71, 0.1, 0.68],
      ];
      for (const [x, y, z, scale, opacity] of placements) {
        const sprite = new THREE.Sprite(material.clone());
        sprite.position.set(x, y, z);
        sprite.scale.setScalar(scale);
        sprite.material.opacity = opacity;
        group.add(sprite);
      }
      return group;
    }

    function makeGround() {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshLambertMaterial({ color: 0x163322 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      ground.name = 'ground';
      return ground;
    }

    function makeLights() {
      const ambient = new THREE.AmbientLight(0x6a78aa, 0.38);
      const moon = new THREE.DirectionalLight(0xc9d7ff, 1.45);
      moon.position.set(6, 8, 4);
      moon.castShadow = true;
      moon.shadow.mapSize.set(1024, 1024);
      moon.shadow.camera.near = 0.5;
      moon.shadow.camera.far = 24;
      moon.shadow.camera.left = -4;
      moon.shadow.camera.right = 4;
      moon.shadow.camera.top = 4;
      moon.shadow.camera.bottom = -4;
      moon.shadow.bias = -0.001;
      const fill = new THREE.DirectionalLight(0xff8a3d, 0.65);
      fill.position.set(-4, 1.4, 3);
      return { ambient, moon, fill };
    }

    function toon(color, extra = {}) {
      return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient, ...extra });
    }

    function basic(color, extra = {}) {
      return new THREE.MeshBasicMaterial({ color, ...extra });
    }

    function addOutlines(root) {
      const targets = [];
      root.traverse((obj) => {
        if (obj.isMesh && obj.material.isMeshToonMaterial) targets.push(obj);
      });
      for (const mesh of targets) {
        const hull = new THREE.Mesh(mesh.geometry, outlineMat);
        hull.userData.outline = true;
        mesh.add(hull);
      }
    }

    function onFace(obj, x, y, lift = 0.004) {
      const dx = x / SKULL_R.x;
      const dy = (y - SKULL_C.y) / SKULL_R.y;
      const z = SKULL_R.z * Math.sqrt(Math.max(0, 1 - dx * dx - dy * dy));
      const n = new THREE.Vector3(
        x / (SKULL_R.x * SKULL_R.x),
        (y - SKULL_C.y) / (SKULL_R.y * SKULL_R.y),
        z / (SKULL_R.z * SKULL_R.z),
      ).normalize();
      obj.position.set(x, y, z).addScaledVector(n, lift);
      obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
      return obj;
    }

    function makeCharacter() {
      const skin = toon(SKIN, { gradientMap: skinGradient, emissive: 0x3a2216 });
      const hoodie = toon(HOODIE);
      const hoodieRib = toon(0x24242b);
      const jean = toon(JEAN);
      const jeanCuff = toon(JEAN_CUFF);
      const stringMat = toon(0x55555c);
      const agletMat = toon(0x9a9aa0);
      const white = toon(0xf4f4f2);
      const sole = toon(0xe4e0d8);
      const laceMat = toon(0xc9ced8);
      const stripe = toon(0x2f6fe0);

      const character = new THREE.Group();
      character.name = 'character';

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.34, 0.66, 24), hoodie);
      torso.position.set(0, 0.88, 0);
      character.add(torso);

      const waistband = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.32, 0.07, 24), hoodieRib);
      waistband.position.set(0, 0.565, 0);
      character.add(waistband);

      const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 14), hoodie);
      shoulders.scale.set(1.28, 0.52, 0.92);
      shoulders.position.set(0, 1.12, 0);
      character.add(shoulders);

      const hoodRim = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.06, 10, 28), hoodie);
      hoodRim.rotation.x = Math.PI / 2 - 0.25;
      hoodRim.position.set(0, 1.19, 0.0);
      character.add(hoodRim);

      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.022, 8, 24, Math.PI), white);
      collar.rotation.x = Math.PI / 2 - 0.25;
      collar.rotation.z = Math.PI;
      collar.position.set(0, 1.2, 0.13);
      character.add(collar);

      const hood = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 16), hoodie);
      hood.scale.set(1.0, 0.72, 0.6);
      hood.position.set(0, 1.2, -0.3);
      character.add(hood);

      const pocket = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.03), toon(0x121216));
      pocket.position.set(0, 0.7, 0.33);
      pocket.rotation.x = -0.12;
      character.add(pocket);

      for (const x of [-0.055, 0.055]) {
        const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.26, 6), stringMat);
        cord.position.set(x, 0.98, 0.305);
        cord.rotation.z = x > 0 ? -0.06 : 0.06;
        const aglet = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.04, 8), agletMat);
        aglet.position.set(0, -0.14, 0);
        cord.add(aglet);
        character.add(cord);
      }

      const legL = makeLeg('legL', -1, { jean, jeanCuff, white, sole, laceMat, stripe });
      const legR = makeLeg('legR', 1, { jean, jeanCuff, white, sole, laceMat, stripe });
      const armL = makeArm('armL', -1, hoodie, hoodieRib, skin, 'hang');
      const armR = makeArm('armR', 1, hoodie, hoodieRib, skin, 'thumb');

      const head = new THREE.Group();
      head.name = 'head';
      head.position.set(0, 1.18, 0);

      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.4, 48, 36), skin);
      skull.position.copy(SKULL_C);
      skull.scale.set(1.02, 1.04, 0.96);
      head.add(skull);

      head.add(makeFace());

      const hair = makeHair();
      head.add(hair);

      character.add(head, armL, armR, legL, legR);
      addOutlines(character);
      character.traverse((obj) => {
        if (obj.isMesh && !obj.userData.outline && obj.material.isMeshToonMaterial) obj.castShadow = true;
      });

      return { character, head, hair, armL, armR, legL, legR };
    }

    function makeLeg(name, side, m) {
      const leg = new THREE.Group();
      leg.name = name;
      leg.position.set(side * 0.13, 0.68, 0);

      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.085, 0.46, 16), m.jean);
      thigh.position.set(0, -0.26, 0);

      const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.102, 0.1, 0.075, 16), m.jeanCuff);
      cuff.position.set(0, -0.5, 0);

      const shoe = new THREE.Group();
      shoe.position.set(0, -0.64, 0.05);
      shoe.rotation.y = side * 0.4;

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.045, 24), m.sole);
      base.scale.set(0.95, 1, 1.6);
      base.position.set(0, -0.005, 0.015);

      const upper = new THREE.Mesh(new THREE.SphereGeometry(0.09, 18, 12), m.white);
      upper.scale.set(0.95, 0.62, 1.55);
      upper.position.set(0, 0.045, 0.01);

      const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.06, 0.03), m.white);
      tongue.position.set(0, 0.095, -0.05);
      tongue.rotation.x = -0.35;

      shoe.add(base, upper, tongue);

      for (const s of [-1, 1]) {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.045, 0.11), m.stripe);
        panel.position.set(s * 0.083, 0.045, -0.015);
        shoe.add(panel);
      }

      for (const z of [-0.015, 0.015, 0.045]) {
        const lace = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.01, 0.012), m.laceMat);
        lace.position.set(0, 0.1 - Math.max(0, z) * 0.35, z);
        shoe.add(lace);
      }

      leg.add(thigh, cuff, shoe);
      return leg;
    }

    function makeArm(name, side, hoodie, rib, skin, pose) {
      const arm = new THREE.Group();
      arm.name = name;
      arm.position.set(side * 0.36, 1.16, 0);

      if (pose === 'hang') {
        arm.rotation.z = side * 0.16;
        const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.074, 0.4, 14), hoodie);
        sleeve.position.set(0, -0.2, 0);
        const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.06, 12), rib);
        cuff.position.set(0, -0.42, 0);
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.066, 14, 12), skin);
        hand.scale.set(0.9, 1.1, 0.85);
        hand.position.set(0, -0.49, 0.01);
        arm.add(sleeve, cuff, hand);
        return arm;
      }

      // Thumbs-up: shoulder -> elbow out/down, forearm folds up, fist beside chin.
      const UPPER_ROT = 1.02;
      const ELBOW_ROT = 1.8;
      const upperLen = 0.3;
      const foreLen = 0.3;

      const upper = new THREE.Group();
      upper.rotation.z = UPPER_ROT;
      const upperSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.066, upperLen, 14), hoodie);
      upperSleeve.position.set(0, -upperLen / 2, 0);
      upper.add(upperSleeve);

      const elbow = new THREE.Group();
      elbow.position.set(0, -upperLen, 0);
      elbow.rotation.z = ELBOW_ROT;
      const elbowBall = new THREE.Mesh(new THREE.SphereGeometry(0.068, 14, 12), hoodie);
      elbow.add(elbowBall);

      const foreSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.066, 0.062, foreLen, 14), hoodie);
      foreSleeve.position.set(0, -foreLen / 2, 0);
      const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.055, 12), rib);
      cuff.position.set(0, -foreLen, 0);
      elbow.add(foreSleeve, cuff);

      const hand = new THREE.Group();
      hand.position.set(0, -foreLen - 0.075, 0.01);
      hand.rotation.z = -(UPPER_ROT + ELBOW_ROT); // back to upright, world-aligned
      const palm = new THREE.Mesh(new THREE.SphereGeometry(0.072, 16, 12), skin);
      palm.scale.set(1.0, 0.92, 0.85);
      hand.add(palm);
      for (let i = 0; i < 4; i++) {
        const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.019, 0.055, 4, 8), skin);
        finger.rotation.z = Math.PI / 2;
        finger.position.set(-0.012, 0.036 - i * 0.026, 0.05);
        hand.add(finger);
      }
      const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.024, 0.07, 4, 10), skin);
      thumb.position.set(-0.018, 0.1, 0.025);
      thumb.rotation.z = 0.08;
      hand.add(thumb);
      elbow.add(hand);

      upper.add(elbow);
      arm.add(upper);
      return arm;
    }

    function makeFace() {
      const face = new THREE.Group();
      face.name = 'face';
      const decal = { depthWrite: false };
      const scleraMat = basic(0xffffff);
      const eyeMat = basic(EYE);
      const eyeLightMat = basic(EYE_LIGHT);
      const pupilMat = basic(PUPIL);
      const glintMat = basic(0xffffff);
      const lashMat = basic(LASH);
      const browMat = basic(0x3a2a24);
      const blushMat = basic(BLUSH, { transparent: true, opacity: 0.5, ...decal });
      const mouthMat = basic(0x9a4a4a);
      const noseMat = basic(0xf0b49c);

      for (const side of [-1, 1]) {
        face.add(onFace(makeEye(side, { scleraMat, eyeMat, eyeLightMat, pupilMat, glintMat, lashMat }), side * 0.14, 0.4, 0.018));

        const brow = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.008, 6, 12, Math.PI * 0.6), browMat);
        brow.rotation.z = Math.PI * 0.2;
        const browHolder = onFace(new THREE.Group(), side * 0.14, 0.535, 0.012);
        browHolder.add(brow);
        face.add(browHolder);

        const blush = new THREE.Mesh(new THREE.CircleGeometry(0.05, 20), blushMat);
        blush.scale.set(1.3, 0.6, 1);
        const blushHolder = onFace(new THREE.Group(), side * 0.24, 0.29, 0.006);
        blushHolder.add(blush);
        face.add(blushHolder);
      }

      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.032, 0.008, 6, 16, Math.PI * 0.7), mouthMat);
      mouth.rotation.z = Math.PI * 1.15;
      const mouthHolder = onFace(new THREE.Group(), 0, 0.225, 0.006);
      mouthHolder.add(mouth);
      face.add(mouthHolder);

      const nose = new THREE.Mesh(new THREE.CircleGeometry(0.009, 10), noseMat);
      face.add(onFace(nose, 0, 0.3, 0.004));

      return face;
    }

    function makeEye(side, m) {
      const eye = new THREE.Group();
      const sclera = new THREE.Mesh(new THREE.CircleGeometry(0.1, 32), m.scleraMat);
      sclera.scale.y = 1.12;
      const iris = new THREE.Mesh(new THREE.CircleGeometry(0.068, 28), m.eyeMat);
      iris.position.set(0, -0.005, 0.004);
      const irisLow = new THREE.Mesh(new THREE.CircleGeometry(0.044, 24), m.eyeLightMat);
      irisLow.position.set(0, -0.027, 0.006);
      const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.03, 20), m.pupilMat);
      pupil.position.set(0, -0.002, 0.008);
      const glint = new THREE.Mesh(new THREE.CircleGeometry(0.02, 14), m.glintMat);
      glint.position.set(-0.026, 0.028, 0.011);
      const glint2 = new THREE.Mesh(new THREE.CircleGeometry(0.009, 10), m.glintMat);
      glint2.position.set(0.024, -0.03, 0.011);
      const lash = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.013, 6, 24, Math.PI * 0.8), m.lashMat);
      lash.rotation.z = Math.PI * 0.1;
      lash.scale.set(1.02, 1.14, 0.3);
      lash.position.z = 0.012;
      const flick = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.016, 0.004), m.lashMat);
      flick.position.set(side * 0.108, 0.07, 0.012);
      flick.rotation.z = side * 0.6;
      eye.add(sclera, iris, irisLow, pupil, glint, glint2, lash, flick);
      return eye;
    }

    // Tapered teardrop lock, root at origin extending along -y, flattened on z.
    function lockGeometry(length, width, rootColor, tipColor, tipStart) {
      const geo = new THREE.SphereGeometry(1, 14, 12);
      const pos = geo.attributes.position;
      const a = new THREE.Color(rootColor);
      const b = new THREE.Color(tipColor);
      const c = new THREE.Color();
      const colors = [];
      for (let i = 0; i < pos.count; i++) {
        const t = (1 - pos.getY(i)) / 2;
        const taper = width * (1 - 0.7 * Math.pow(t, 1.6));
        pos.setXYZ(i, pos.getX(i) * taper, -t * length, pos.getZ(i) * taper * 0.55);
        c.copy(a).lerp(b, THREE.MathUtils.smoothstep(t, tipStart, tipStart + 0.18));
        colors.push(c.r, c.g, c.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function makeLock(mat, root, tip, width, rootColor, tipColor = rootColor, tipStart = 1) {
      const r = new THREE.Vector3(...root);
      const t = new THREE.Vector3(...tip);
      const dir = t.clone().sub(r);
      const len = dir.length();
      const yAxis = dir.clone().normalize().negate();
      const out = r.clone().add(t).multiplyScalar(0.5).sub(HAIR_CENTER);
      const zAxis = out.addScaledVector(yAxis, -out.dot(yAxis)).normalize();
      const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis);
      const mesh = new THREE.Mesh(lockGeometry(len, width, rootColor, tipColor, tipStart), mat);
      mesh.position.copy(r);
      mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
      return mesh;
    }

    function makeHair() {
      const hair = new THREE.Group();
      hair.name = 'hair';
      const hairMat = toon(HAIR, { gradientMap: hairGradient, side: THREE.DoubleSide });
      const lockMat = toon(0xffffff, { gradientMap: hairGradient, vertexColors: true });

      const crown = new THREE.Mesh(new THREE.SphereGeometry(0.455, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.36), hairMat);
      crown.position.copy(HAIR_CENTER);
      hair.add(crown);

      // Back/side shell, open at the face.
      const shell = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 32, 20, Math.PI / 2 + 1.0, Math.PI * 2 - 2.0, Math.PI * 0.3, Math.PI * 0.48),
        hairMat,
      );
      shell.position.copy(HAIR_CENTER);
      hair.add(shell);

      const bob = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 14), hairMat);
      bob.position.set(0, 0.3, -0.2);
      bob.scale.set(1.35, 1.0, 0.9);
      hair.add(bob);

      // Perimeter locks: [angle deg, tip y, width, tip colour, tip start, outward reach]
      const perimeter = [
        [-60, 0.1, 0.16, LIME, 0.72, 0.51],
        [-84, 0.05, 0.2, HAIR, 1, 0.57],
        [-108, 0.02, 0.21, HAIR, 1, 0.58],
        [-132, 0.04, 0.21, HAIR, 1, 0.55],
        [-156, 0.02, 0.21, HAIR, 1, 0.54],
        [180, 0.03, 0.21, HAIR, 1, 0.54],
        [156, 0.01, 0.21, HAIR, 1, 0.54],
        [132, 0.04, 0.21, HAIR, 1, 0.55],
        [108, 0.02, 0.21, LIME, 0.62, 0.58],
        [84, 0.05, 0.2, LIME, 0.55, 0.57],
        [60, 0.1, 0.16, LIME, 0.5, 0.51],
        [-72, 0.21, 0.13, HAIR, 1, 0.55],
        [-96, 0.14, 0.14, HAIR, 1, 0.59],
        [-120, 0.12, 0.15, HAIR, 1, 0.58],
        [120, 0.12, 0.15, HAIR, 1, 0.58],
        [96, 0.14, 0.14, HAIR, 1, 0.59],
      ];
      for (const [deg, tipY, width, tipColor, tipStart, reach] of perimeter) {
        const a = THREE.MathUtils.degToRad(deg);
        const s = Math.sin(a);
        const c = Math.cos(a);
        hair.add(makeLock(
          lockMat,
          [s * 0.4, 0.64, c * 0.4 - 0.02],
          [s * reach, tipY, c * reach - 0.02],
          width, HAIR, tipColor, tipStart,
        ));
      }

      // Lime under-layer peeking out on the character's left (+x) side.
      for (const [deg, tipY] of [[74, 0.16], [97, 0.12]]) {
        const a = THREE.MathUtils.degToRad(deg);
        hair.add(makeLock(
          lockMat,
          [Math.sin(a) * 0.36, 0.5, Math.cos(a) * 0.36 - 0.02],
          [Math.sin(a) * 0.58, tipY, Math.cos(a) * 0.58 - 0.02],
          0.11, LIME,
        ));
      }

      // Swept bangs: viewer's upper-left to lower-right across the forehead.
      const bangs = [
        { root: [-0.3, 0.68, 0.19], tip: [-0.3, 0.46, 0.34], w: 0.11, c: HAIR, t: HAIR, s: 1 },
        { root: [-0.22, 0.73, 0.22], tip: [-0.17, 0.51, 0.39], w: 0.11, c: HAIR, t: LIME, s: 0.45 },
        { root: [-0.12, 0.75, 0.25], tip: [0.02, 0.5, 0.42], w: 0.12, c: LIME, t: LIME, s: 1 },
        { root: [-0.02, 0.76, 0.25], tip: [0.14, 0.5, 0.41], w: 0.13, c: LIME, t: LIME, s: 1 },
        { root: [0.08, 0.75, 0.25], tip: [0.25, 0.49, 0.37], w: 0.13, c: LIME, t: LIME, s: 1 },
        { root: [0.18, 0.73, 0.23], tip: [0.35, 0.45, 0.29], w: 0.12, c: LIME, t: LIME, s: 1 },
      ];
      for (const b of bangs) hair.add(makeLock(lockMat, b.root, b.tip, b.w, b.c, b.t, b.s));

      const ahoge = new THREE.Mesh(
        new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.8, -0.02),
            new THREE.Vector3(0.02, 0.93, 0.0),
            new THREE.Vector3(0.08, 0.99, 0.03),
            new THREE.Vector3(0.13, 0.95, 0.05),
          ]),
          16, 0.018, 6, false,
        ),
        hairMat,
      );
      hair.add(ahoge);

      return hair;
    }
  </script>
